<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MealUp · Review r2 source owner identica</title>
  <style>
    :root{font-family:Inter,ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;color:#33261f;background:#f4eee5}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 50% 10%,#fffaf1,#eadfce)}
    .review{width:min(100%,430px)}
    .label{margin:0 0 10px 4px;font-size:12px;font-weight:800;letter-spacing:.12em;color:#a24f24;text-transform:uppercase}
    .card{overflow:hidden;border-radius:38px;background:#fff9ef;box-shadow:0 28px 80px #5f38242b,0 2px 0 #fff inset;border:1px solid #fff4e6}
    .portrait-crop{width:100%;aspect-ratio:1/1;overflow:hidden;background:#fff8eb}
    .portrait{display:block;width:100%;height:100%;object-fit:cover;object-position:center center}
    .copy{padding:22px 24px 26px}
    h1{font-size:25px;line-height:1.08;margin:0 0 8px;letter-spacing:-.035em}
    .meta{margin:0;color:#715f55;font-size:14px}
    .status{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
    .pill{font-size:10px;font-weight:850;letter-spacing:.04em;padding:6px 9px;border-radius:999px;background:#fff0df;color:#91451d}
    .warning{margin-top:16px;padding:13px 15px;border:1px solid #f2c89e;border-radius:16px;background:#fff8ec;color:#74472c;font-size:12px;line-height:1.4}
    @media(max-width:480px){body{padding:14px}.card{border-radius:31px}.copy{padding:19px 20px 23px}}
  </style>
</head>
<body>
  <main class="review" aria-label="Composizione owner identica non approvata">
    <p class="label">Review corretta · source owner identica</p>
    <article class="card">
      <div class="portrait-crop">
        <img class="portrait" src="../candidates/r2-owner-exact-source-003.png" alt="Food Portrait owner della poke bowl con gauge incorporato da 480 chilocalorie">
      </div>
      <div class="copy">
        <h1>Poke bowl tonno e avocado</h1>
        <p class="meta">Source visiva owner · crop centrale non distruttivo</p>
        <div class="status" aria-label="Stato revisione">
          <span class="pill">Visual identica</span><span class="pill">Non approvata per i dati</span>
        </div>
        <p class="warning"><strong>Gate dati aperto:</strong> l’immagine mostra 480 kcal; la ricetta r2 attuale dichiara 490 kcal. Nessun valore è stato modificato.</p>
      </div>
    </article>
  </main>
</body>
</html>
