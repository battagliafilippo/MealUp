<!doctype html>
<html lang="it">
<meta charset="utf-8">
<title>MealUp gauge deterministico mobile</title>
<style>
  @font-face{font-family:Satoshi;src:url('../../../G9/fonts/Satoshi-Bold.woff2') format('woff2');font-weight:700}
  html,body{margin:0;width:510px;height:420px;overflow:hidden;background:#fff8e9}
  .gauge{position:relative;width:510px;height:420px}
  .layer{position:absolute;inset:0;width:510px;height:420px}
  .needle{transform-origin:248px 232px;transition:transform 220ms cubic-bezier(.2,0,0,1)}
  .value,.unit{position:absolute;left:154px;width:186px;text-align:center;color:#3d3933;font-family:Satoshi,Arial,sans-serif;font-weight:700;line-height:1}
  .value{top:259px;font-size:58px;letter-spacing:-2px}
  .unit{top:311px;font-size:34px;letter-spacing:-1px}
  @media (prefers-reduced-motion:reduce){.needle{transition-duration:0ms}}
</style>
<div class="gauge" role="img" aria-live="polite">
  <img class="layer" src="../../../tools/food-portrait-pipeline/assets/gauge-shell-canonical.png" alt="">
  <img class="layer needle" src="../../../tools/food-portrait-pipeline/assets/gauge-needle-canonical.png" alt="">
  <div class="value"></div><div class="unit">kcal</div>
</div>
<script>
  const params=new URLSearchParams(location.search),kcal=Math.max(0,Number(params.get('kcal')||270));
  const clamped=Math.min(1000,kcal),target=-60+(clamped/1000)*120,source=-27.6;
  const contractDelta=target-source;
  const visualScale=contractDelta<0?14/(source-(-48.6)):121/(57-source),delta=contractDelta*visualScale;
  const zone=clamped<200?'GREEN':clamped<400?'LIME':clamped<600?'YELLOW':clamped<800?'ORANGE':'RED';
  document.querySelector('.needle').style.transform=`rotate(${delta}deg)`;
  document.querySelector('.value').textContent=String(kcal);
  document.querySelector('.gauge').setAttribute('aria-label',`${kcal} kcal, zona ${zone}, lancetta ${target.toFixed(1)} gradi`);
</script>
</html>
