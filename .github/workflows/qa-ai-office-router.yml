name: QA - MealUp AI Office Router

# Lab-only: no app deployment, no paid APIs or model calls.
on:
  push:
    branches:
      - experiment/recipe-visual-agents
    paths:
      - 'tools/ai-office/**'
      - '.agents/skills/mealup-*/SKILL.md'
      - '.github/workflows/qa-ai-office-router.yml'
  pull_request:
    branches:
      - experiment/recipe-visual-agents
    paths:
      - 'tools/ai-office/**'
      - '.agents/skills/mealup-*/SKILL.md'
      - '.github/workflows/qa-ai-office-router.yml'

permissions:
  contents: read

concurrency:
  group: ai-office-router-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  router-qa:
    name: Selective routing and safety gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm router and tests are present
        run: |
          test -f tools/ai-office/router.cjs
          test -f tools/ai-office/router.test.cjs
          node --version
      - name: Audit canonical Masterplan and prior-step continuity
        run: |
          node tools/ai-office/masterplan-audit.cjs
          if git cat-file -e HEAD^:tools/ai-office/masterplan-ledger.json 2>/dev/null; then
            git show HEAD^:tools/ai-office/masterplan-ledger.json > /tmp/mealup-office-previous-ledger.json
            node tools/ai-office/masterplan-audit.cjs --compare /tmp/mealup-office-previous-ledger.json
          else
            echo 'First-ledger bootstrap: direct schema tests still required'
          fi
      - name: Execute router tests (zero external dependencies)
        run: node --test tools/ai-office/*.test.cjs
