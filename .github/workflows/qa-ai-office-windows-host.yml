name: QA - AI Office Private Windows NTFS Host

# Uses disposable synthetic folders only. NO Constitution, secrets, external AI, or deployment.
on:
  push:
    branches:
      - experiment/recipe-visual-agents
    paths:
      - 'tools/ai-office/windows-private-host.ps1'
      - 'tools/ai-office/windows-private-host.test.ps1'
      - 'tools/ai-office/private-file-security.cjs'
      - 'tools/ai-office/private-file-security.windows.test.cjs'
      - 'tools/ai-office/director-private-ledger.cjs'
      - 'tools/ai-office/director-private-mailbox.cjs'
      - 'tools/ai-office/director-host-recovery.cjs'
      - 'tools/ai-office/director-local-readonly.cjs'
      - 'tools/ai-office/director-secure-preflight.cjs'
      - 'tools/ai-office/constitution-protected-handoff.cjs'
      - '.github/workflows/qa-ai-office-windows-host.yml'
  pull_request:
    branches:
      - experiment/recipe-visual-agents
    paths:
      - 'tools/ai-office/windows-private-host.ps1'
      - 'tools/ai-office/windows-private-host.test.ps1'
      - 'tools/ai-office/private-file-security.cjs'
      - 'tools/ai-office/private-file-security.windows.test.cjs'
      - 'tools/ai-office/director-private-ledger.cjs'
      - 'tools/ai-office/director-private-mailbox.cjs'
      - 'tools/ai-office/director-host-recovery.cjs'
      - 'tools/ai-office/director-local-readonly.cjs'
      - 'tools/ai-office/director-secure-preflight.cjs'
      - 'tools/ai-office/constitution-protected-handoff.cjs'
      - '.github/workflows/qa-ai-office-windows-host.yml'

permissions:
  contents: read

jobs:
  ntfs-bootstrap:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout isolated laboratory (no credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify true Windows NTFS sandbox
        shell: pwsh
        run: |
          if (-not $IsWindows) { throw 'WINDOWS_RUNNER_REQUIRED' }
          if (-not $env:LOCALAPPDATA) { throw 'LOCALAPPDATA_REQUIRED' }
      - name: Run synthetically scoped ACL tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tools\ai-office\windows-private-host.test.ps1
      - name: Verify fail-closed Node and Python bridge without private source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --test .\tools\ai-office\private-file-security.windows.test.cjs
          python -c "compile(open(r'tools/ai-office/constitution-task-packet.py', encoding='utf-8').read(), r'tools/ai-office/constitution-task-packet.py', 'exec')"
