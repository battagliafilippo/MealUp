name: QA - MealUp Recipe Analyzer (M2)
on:
  push:
    branches:
      - experiment/recipe-visual-agents
    paths:
      - tools/recipe-visuals/**
      - .github/workflows/qa-recipe-analyzer.yml
      - assets/family-fo/manifest.json
      - G8/composition-matrix.json
  workflow_dispatch:
    inputs:
      groq_live_pilot:
        description: 'Eseguire una sola chiamata Groq LIVE sul piano Free verificato?'
        required: true
        default: 'NO'
        type: choice
        options:
          - 'NO'
          - 'YES'
      recipe_id:
        description: 'ID della singola ricetta pilota'
        required: true
        default: 'r2'
        type: string

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local QA dependency (not in PWA)
        run: npm install --no-save --no-package-lock jsdom
      - name: Test analyzer safeguards
        run: node tools/recipe-visuals/recipe-analyzer.cjs --self-test
      - name: Analyze all actual MealUp recipes
        run: node tools/recipe-visuals/recipe-analyzer.cjs --out /tmp/mealup-visual-analysis
      - name: Verify outputs are valid and no recipe lost
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const dir='/tmp/mealup-visual-analysis/';
          const report=JSON.parse(fs.readFileSync(dir+'analysis-report.v1.json'));
          const doc=JSON.parse(fs.readFileSync(dir+'recipe-specs.v1.json'));
          assert.equal(report.result,'PASS');
          assert.equal(report.appRecipes,454);
          assert.equal(report.uniqueIds,454);
          assert.equal(report.familyMapped,454);
          assert.equal(doc.recipes.length,454);
          assert.ok(doc.recipes.every(r=>r.imageStatus==='PENDING'&&r.qaApproved===false&&r.imageUrl===null));
          console.log('PASS M2 454/454 verified; no image generated, 0 API calls');
          NODE
      - name: Save structured result for review (no deploy or commit)
        uses: actions/upload-artifact@v4
        with:
          name: mealup-recipe-analyzer-m2
          path: /tmp/mealup-visual-analysis/
          if-no-files-found: error
          retention-days: 30
      - name: M3 - Verify Visual Director protections
        run: node tools/recipe-visuals/visual-director.cjs --self-test
      - name: M3 - Build all full-dish visual briefs without AI credits
        run: node tools/recipe-visuals/visual-director.cjs --input /tmp/mealup-visual-analysis/recipe-specs.v1.json --composition G8/composition-matrix.json --out /tmp/mealup-visual-director/
      - name: M3 - Gate all 454 unapproved briefs
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const dir = '/tmp/mealup-visual-director/';
          const report = JSON.parse(fs.readFileSync(dir + 'director-report.v1.json', 'utf8'));
          const doc = JSON.parse(fs.readFileSync(dir + 'visual-briefs.v1.json', 'utf8'));
          assert.equal(report.result, 'PASS');
          assert.equal(report.total, 454);
          assert.equal(report.uniqueIds, 454);
          assert.equal(report.explicitEvidenceNeedsValidation, 102);
          assert.equal(report.noExplicitEvidenceNeedsInference, 352);
          assert.equal(report.safeToGenerate, 0);
          assert.equal(report.vesselMapped, 454);
          assert.equal(report.imagesGenerated, 0);
          assert.equal(report.apiCalls, 0);
          assert.equal(doc.recipes.length, 454);
          assert.ok(doc.recipes.every(r => r.vessel && r.vessel.id &&
            r.planningRequest.inputFacts.vesselId === r.vessel.id));
          assert.equal(doc.recipes.find(r => r.recipeId === 'r2').vessel.id, 'VESSEL_BOWL');
          assert.ok(doc.recipes.every(r => !r.safeToGenerate &&
            r.imageStatus === 'PENDING' && r.imageUrl === null && r.approvalStatus === 'NOT_REVIEWED'));
          console.log('PASS M3: 454 full-dish planning briefs; 352 inference cases queued; 0 hallucinated placements approved');
          NODE
      - name: Save M3 visual briefs for review (no deploy or commit)
        uses: actions/upload-artifact@v4
        with:
          name: mealup-visual-director-m3
          path: /tmp/mealup-visual-director/
          if-no-files-found: error
          retention-days: 30
      - name: M3b - Test Groq adapter safeguards without network
        run: node tools/recipe-visuals/groq-reasoner.cjs --self-test
      - name: M3b - Verify provider DRY RUN requires no credentials
        run: node tools/recipe-visuals/groq-reasoner.cjs --input /tmp/mealup-visual-director/visual-briefs.v1.json --out /tmp/mealup-groq-reasoner/
      - name: M3b - Mock checkpoint and unapproved visual reasoning (no provider calls)
        run: |
          node tools/recipe-visuals/groq-reasoner.cjs --input /tmp/mealup-visual-director/visual-briefs.v1.json --out /tmp/mealup-groq-reasoner/ --mock --max 2
          node <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const p='/tmp/mealup-groq-reasoner/reasoner-state.v1.json';
          const obj=JSON.parse(fs.readFileSync(p,'utf8'));
          assert.equal(obj.schema,'groq-reasoner-v1');
          assert.equal(Object.keys(obj.records).length,2);
          for(const item of Object.values(obj.records)){
            assert.equal(item.model,'MOCK_NOT_REAL');
            assert.equal(item.status,'REQUIRES_HUMAN_QA');
            assert.equal(item.qaApproved,false);
            assert.equal(item.safeToGenerate,false);
            assert.equal(item.imageStatus,'PENDING');
            assert.equal(item.imageUrl,null);
          }
          console.log('PASS M3b mock: 2 source linked candidates, no real inference, approval denied');
          NODE
      - name: M3b - Verify resumability with mock checkpoint
        run: |
          node tools/recipe-visuals/groq-reasoner.cjs --input /tmp/mealup-visual-director/visual-briefs.v1.json --out /tmp/mealup-groq-reasoner/ --mock --max 1
          node -e "const s=require('/tmp/mealup-groq-reasoner/reasoner-state.v1.json'); if(Object.keys(s.records).length!==3)process.exit(1);console.log('PASS M3b resume 3 unique IDs')"
      - name: Store M3b dry-run proof (no secret and no calls)
        uses: actions/upload-artifact@v4
        with:
          name: mealup-groq-reasoner-m3b-mock
          path: /tmp/mealup-groq-reasoner/reasoner-state.v1.json
          if-no-files-found: error
          retention-days: 14
      - name: M3b - Groq LIVE single-recipe pilot (manual opt-in or one-time final M3c gate)
        if: >-
          ${{
            (github.event_name == 'workflow_dispatch' && inputs.groq_live_pilot == 'YES') ||
            (github.event_name == 'push' &&
             github.ref == 'refs/heads/experiment/recipe-visual-agents' &&
             github.event.head_commit.message == 'chore(groq): run final branded-vessel r2 pilot')
          }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MEALUP_GROQ_FREE_TIER_CONFIRMED: 'YES'
          MEALUP_GROQ_PILOT_RECIPE_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.recipe_id || 'r2' }}
        run: |
          node tools/recipe-visuals/groq-reasoner.cjs \
            --input /tmp/mealup-visual-director/visual-briefs.v1.json \
            --out /tmp/mealup-groq-live-pilot/ \
            --live --max 1 --recipe-id "$MEALUP_GROQ_PILOT_RECIPE_ID"
      - name: M3b - Verify LIVE pilot remains unapproved
        if: >-
          ${{
            (github.event_name == 'workflow_dispatch' && inputs.groq_live_pilot == 'YES') ||
            (github.event_name == 'push' &&
             github.ref == 'refs/heads/experiment/recipe-visual-agents' &&
             github.event.head_commit.message == 'chore(groq): run final branded-vessel r2 pilot')
          }}
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const p='/tmp/mealup-groq-live-pilot/reasoner-state.v1.json';
          const obj=JSON.parse(fs.readFileSync(p,'utf8'));
          assert.equal(Object.keys(obj.records).length,1);
          const item=Object.values(obj.records)[0];
          assert.equal(item.recipeId,'r2');
          assert.equal(item.candidate.vesselId,'VESSEL_BOWL');
          assert.ok(!/trasparent|transparent/i.test([
            item.candidate.vesselDescription,
            item.candidate.dishPortraitDescription,
            item.candidate.finalImagePrompt
          ].join(' ')));
          assert.ok(/cream|crema/i.test(item.candidate.finalImagePrompt));
          assert.ok(/orange|arancion/i.test(item.candidate.finalImagePrompt));
          assert.ok(/MealUp Toys 3D/i.test(item.candidate.finalImagePrompt));
          assert.ok(!/\b(nero|nera|neri|nere|black|dark|scur[oaie])\b/i.test([
            item.candidate.vesselDescription,
            item.candidate.dishPortraitDescription,
            item.candidate.finalImagePrompt
          ].join(' ')));
          assert.ok(!/\b(gauge|lancetta|kcal|calorie|cta)\b/i.test(item.candidate.finalImagePrompt));
          assert.equal(item.qaApproved,false);
          assert.equal(item.safeToGenerate,false);
          assert.equal(item.imageStatus,'PENDING');
          assert.equal(item.imageUrl,null);
          console.log('PASS M3b LIVE pilot: 1 proposal, human QA required, 0 images');
          NODE
      - name: Store M3b LIVE pilot for human review
        if: >-
          ${{
            (github.event_name == 'workflow_dispatch' && inputs.groq_live_pilot == 'YES') ||
            (github.event_name == 'push' &&
             github.ref == 'refs/heads/experiment/recipe-visual-agents' &&
             github.event.head_commit.message == 'chore(groq): run final branded-vessel r2 pilot')
          }}
        uses: actions/upload-artifact@v4
        with:
          name: mealup-groq-live-pilot-${{ github.event_name == 'workflow_dispatch' && inputs.recipe_id || 'r2' }}
          path: /tmp/mealup-groq-live-pilot/reasoner-state.v1.json
          if-no-files-found: error
          retention-days: 14
