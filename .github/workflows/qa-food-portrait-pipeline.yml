name: QA - MealUp Food Portrait Contracts
on:
  push:
    branches:
      - experiment/food-portrait-pipeline-20261015
    paths:
      - tools/food-portrait-pipeline/**
      - .github/workflows/qa-food-portrait-pipeline.yml
      - G8/composition-matrix.json
      - assets/family-fo/manifest.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse audited source
        run: node --check tools/food-portrait-pipeline/contract-audit.cjs
      - name: Negative tests and future growth
        run: node tools/food-portrait-pipeline/contract-audit.cjs --self-test
      - name: Verify real 454-recipe matrix and family mapping
        run: node tools/food-portrait-pipeline/contract-audit.cjs --out /tmp/mealup-food-portrait-contract.json
      - name: Enforce fail-closed staging and no premature image approval
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const r = JSON.parse(fs.readFileSync('/tmp/mealup-food-portrait-contract.json','utf8'));
          assert.equal(r.status, 'PASS_CONTRACT_ONLY');
          assert.equal(r.catalog.matrixRows, 454);
          assert.equal(r.catalog.manifestMappings, 454);
          assert.equal(r.catalog.uniqueRecipeIds, 454);
          assert.equal(r.catalog.families, 14);
          assert.equal(r.scope.goldenMastersVerified, false);
          assert.equal(r.scope.imagePixelsInspected, false);
          assert.equal(r.scope.imagesApproved, 0);
          assert.equal(r.scope.automaticImageAcceptanceAllowed, false);
          assert.deepEqual(r.errors, []);
          console.log('PASS: 454 source records validated. Images not assessed or approved.');
          NODE
      - name: Test vessel fail-closed safeguards
        run: node tools/food-portrait-pipeline/vessel-asset-audit.cjs --self-test
      - name: Verify historical FROZEN vessel image binaries
        run: node tools/food-portrait-pipeline/vessel-asset-audit.cjs --out /tmp/mealup-food-portrait-vessels.json
      - name: Assert exact vessel coverage and no image admission
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const a=JSON.parse(fs.readFileSync('/tmp/mealup-food-portrait-vessels.json','utf8'));
          assert.equal(a.status,'PASS_BINARY_INTEGRITY_ONLY');
          assert.equal(a.geometryVessels,8);
          assert.ok(a.loadedBinaryFileCount >= 17 && a.loadedBinaryFileCount <= 25);
          assert.equal(a.recipesWithNoVessel,14);
          assert.equal(a.imageSemanticsVerified,false);
          assert.equal(a.portraitQAApproved,false);
          assert.equal(a.automaticApprovalEnabled,false);
          assert.deepEqual(a.errors,[]);
          console.log('PASS FROZEN vessel binaries: 25 checked; 8 geometries, 14 VESSEL_FREE.');
          NODE
      - name: Save audit evidence (including blocked cases, no deploy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: food-portrait-contract-baseline
          path: |
            /tmp/mealup-food-portrait-contract.json
            /tmp/mealup-food-portrait-vessels.json
          if-no-files-found: warn
          retention-days: 30

  preproduction-specs:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing M2 test harness only (not PWA runtime)
        run: npm install --no-save --no-package-lock jsdom sharp
      - name: Test contracts with negative cases, including future recipe
        run: |
          node --check tools/food-portrait-pipeline/portrait-contract.cjs
          node tools/food-portrait-pipeline/portrait-contract.cjs --self-test
      - name: Generate real M2 specs from 454 app recipes
        run: node tools/recipe-visuals/recipe-analyzer.cjs --out /tmp/mealup-m2-for-portrait
      - name: Generate M3 briefs from preserved vessel matrix
        run: |
          node tools/recipe-visuals/visual-director.cjs --input /tmp/mealup-m2-for-portrait/recipe-specs.v1.json --composition G8/composition-matrix.json --out /tmp/mealup-m3-for-portrait
      - name: Compile 454 source-traced production specifications and queue
        run: |
          node tools/food-portrait-pipeline/portrait-contract.cjs --input /tmp/mealup-m3-for-portrait/visual-briefs.v1.json --out /tmp/mealup-portrait-staging
      - name: Assert no fake image approval and exact source parity
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const dir='/tmp/mealup-portrait-staging/';
          const specs=JSON.parse(fs.readFileSync(dir+'portrait-specifications.v1.json','utf8'));
          const queue=JSON.parse(fs.readFileSync(dir+'production-queue.v1.json','utf8'));
          const coverage=JSON.parse(fs.readFileSync(dir+'coverage-report.v1.json','utf8'));
          assert.equal(specs.total,454);
          assert.equal(queue.total,454);
          assert.equal(coverage.referenceBlocked,454);
          assert.equal(coverage.readyToGenerate,0);
          assert.equal(coverage.imagesAccepted,0);
          assert.equal(new Set(specs.recipes.map(s=>s.recipeId)).size,454);
          assert.deepEqual(specs.recipes.map(s=>s.recipeId),queue.tasks.map(t=>t.recipeId));
          for (const s of specs.recipes) {
            assert.equal(s.acceptanceState,'BLOCKED_REFERENCE');
            assert.equal(s.production.QAStatus,'NOT_REVIEWED');
            assert.equal(s.production.imageSource,null);
            assert.equal(s.production.autoApprovalAllowed,false);
            assert.equal(s.production.vesselRequired,s.production.vesselId!=='VESSEL_FREE');
          }
          console.log('PASS 454 MealUp portrait specifications: no placeholders mistaken for completed images');
          NODE
      - name: Verify queue resume and revision invalidation
        run: |
          node --check tools/food-portrait-pipeline/queue-recovery.cjs
          node tools/food-portrait-pipeline/queue-recovery.cjs --self-test
          node tools/food-portrait-pipeline/queue-recovery.cjs --queue /tmp/mealup-portrait-staging/production-queue.v1.json --checkpoint /tmp/mealup-portrait-staging/checkpoint.v1.json
          node tools/food-portrait-pipeline/queue-recovery.cjs --queue /tmp/mealup-portrait-staging/production-queue.v1.json --checkpoint /tmp/mealup-portrait-staging/checkpoint.v1.json
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const s=JSON.parse(fs.readFileSync('/tmp/mealup-portrait-staging/checkpoint.v1.json','utf8'));
          assert.equal(s.summary.total,454);
          assert.equal(s.summary.resumed,454);
          assert.equal(s.summary.readyToGenerate,0);
          assert.equal(s.history.length,0);
          assert.ok(Object.values(s.records).every(x=>x.state==='WAITING_REFERENCE'&&x.approval===null));
          console.log('PASS REAL CATALOG QUEUE RESUME: 454 stable records, 0 loss, 0 approval');
          NODE
      - name: Test technical image QA with decoded real pixels
        run: |
          node --check tools/food-portrait-pipeline/image-technical-qa.cjs
          node tools/food-portrait-pipeline/image-technical-qa.cjs --self-test
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const {inspect}=require('./tools/food-portrait-pipeline/image-technical-qa.cjs');
          (async()=>{
            const p='assets/family-fo/pasta.webp';
            const r=await inspect(fs.readFileSync(p),{maxBytes:2000000,
              minVisibleFraction:0.005,maxVisibleFraction:0.97});
            assert.equal(r.format,'webp');
            assert.ok(r.width>0&&r.height>0&&r.sha256.length===64);
            assert.equal(r.quality.acceptanceAllowed,false);
            console.log('PASS independent image decoder on actual family FO (not a food portrait):',
              r.width,r.height,r.status);
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
      - name: Store preproduction evidence (no deploy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: food-portrait-preproduction-454
          path: |
            /tmp/mealup-portrait-staging/
          if-no-files-found: warn
          retention-days: 14
