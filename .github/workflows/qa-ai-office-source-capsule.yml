name: AI Office - Public Lab Source Capsule
# Export ONLY public laboratory source for a separately isolated, private, source-verified local test.
# Never uploads private Constitution, keys, local workdirs, artifacts or model responses.
on:
  push:
    branches: [experiment/recipe-visual-agents]
    paths:
      - .github/workflows/qa-ai-office-source-capsule.yml
      - tools/ai-office/director-host-recovery.cjs
      - tools/ai-office/director-host-recovery.test.cjs
permissions:
  contents: read
jobs:
  public-source-capsule:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify expected lab branch and public files
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "experiment/recipe-visual-agents"
          test -f tools/ai-office/director-local-readonly.cjs
          test -f tools/ai-office/constitution-task-packet.py
          test ! -e Costituzione_Operativa_AI_v1.9_FROZEN.docx
          test ! -e .env
      - name: Pack allowlisted public source only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mealup-office-capsule
          printf '%s\n' "$GITHUB_SHA" > /tmp/mealup-office-capsule/commit.txt
          tar -czf /tmp/mealup-office-capsule/office-public-source.tar.gz             --exclude='*.png' --exclude='*.webp'             tools/ai-office .agents/skills docs/ai-office AGENTS.md
          tar -tzf /tmp/mealup-office-capsule/office-public-source.tar.gz > /tmp/mealup-office-capsule/file-list.txt
          grep -q 'tools/ai-office/director-local-readonly.cjs' /tmp/mealup-office-capsule/file-list.txt
      - name: Upload allowlisted source capsule (NO PRIVATE DATA)
        uses: actions/upload-artifact@v4
        with:
          name: mealup-office-public-lab-source
          path: /tmp/mealup-office-capsule/
          if-no-files-found: error
          retention-days: 1
