:root{
  /* I token veri stanno nel blocco TEMA CHIARO in fondo al foglio:
     qui restano solo quelli che non dipendono dal tema. */
  --font-system:"Satoshi",sans-serif;
  --r-lg:22px; --r-md:12px; --r-sm:8px; --raggio:var(--r-lg);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--font-system);-webkit-tap-highlight-color:transparent}
/* Sul telefono i caratteri erano piccoli: la radice sale al 112% e ogni
   misura in rem cresce di conseguenza, in tutta l'app. */
/* Caratteri piu' grandi in tutta l'app: sul telefono si deve leggere
   senza strizzare gli occhi. */
html{font-size:122%}
body{font-size:1rem;font-weight:var(--peso-testo,500)}
button,input,select,textarea{font-size:1rem}
button,.chip,.tab-item,a{touch-action:manipulation;cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
body{
  background-color:var(--bg-main);color:var(--text-primary);
  min-height:100vh;min-height:100dvh;overflow-x:hidden;
  padding-bottom:calc(85px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
body.locked{overflow:hidden}

/* ---------- sfondo ambient ---------- */
.ambient-mesh{position:fixed;inset:0;z-index:-1;overflow:hidden;filter:blur(110px) saturate(70%);opacity:.35;pointer-events:none}
.blob{position:absolute;border-radius:50%}
.blob-1{width:300px;height:300px;top:-50px;left:-50px}
.blob-2{width:350px;height:350px;bottom:100px;right:-50px}
.blob-3{width:250px;height:250px;top:40%;left:30%}

#app{padding:calc(18px + env(safe-area-inset-top)) 16px 24px;max-width:600px;margin:0 auto}
.view{display:none}
.view.active{display:block;animation:fadeIn .25s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- header ---------- */
.header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.subtitle{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:1.4px;color:var(--text-secondary);font-weight:600}
h1{font-size:1.9rem;font-weight:var(--peso-titoli,800);letter-spacing:-.5px;line-height:1.15}
h3{font-size:.98rem;font-weight:calc(var(--peso-titoli,800) - 100);letter-spacing:-.2px}
h4{font-size:1rem;font-weight:calc(var(--peso-titoli,800) - 100);letter-spacing:-.2px}
.icon-btn{background:var(--glass-bg);border:1px solid var(--glass-border);color:var(--accent-primary);
  font-size:1.5rem;line-height:1;width:42px;height:42px;flex:0 0 42px;border-radius:50%;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:transform .12s ease-out}
.icon-btn:active{transform:scale(.94)}

/* ---------- chip ---------- */
.filter-bar{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;margin-bottom:4px;scrollbar-width:none}
.filter-bar::-webkit-scrollbar{display:none}
.chip{background:var(--glass-bg);border:1px solid var(--glass-border);color:var(--text-primary);
  padding:8px 14px;border-radius:20px;font-size:.75rem;font-weight:600;letter-spacing:.4px;
  white-space:nowrap;backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);
  transition:transform .12s ease-out,background .15s ease-out}
.chip:active{transform:scale(.94)}
.chip.active{background:var(--accent-primary);color:var(--accent-primary-contrast);font-weight:700;border-color:var(--accent-primary)}
.chip i{font-style:normal;font-size:.62rem;font-weight:600;letter-spacing:.04em;
  opacity:.62;margin-left:3px;text-transform:none}
.chip.ban{background:rgba(224,122,107,.16);border-color:rgba(224,122,107,.45);color:#f0a397}
/* Area tattile: il segno resta piccolo, la zona sensibile no. Con le mani
   bagnate un bersaglio da 20 px non si prende. */
.x{background:none;border:none;color:inherit;font-size:.9rem;font-weight:700;line-height:1;
  min-width:34px;min-height:34px;display:inline-flex;align-items:center;justify-content:center;
  margin:-8px -8px -8px 2px;opacity:.75}
.x:active{opacity:1}
.chip .x{margin:-8px -6px -8px 2px}

.pantry-grid{display:flex;flex-wrap:wrap;gap:8px}
.tags-container{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- card ---------- */
/* ---------- home a tre pagine ----------
   Colazione, pranzo e cena hanno la stessa struttura e tre atmosfere diverse:
   il mattino caldo, il giorno verde, la sera profonda. Il tema si sposta
   ancora quando cerchi un ingrediente: pesce azzurro, carne mattone, verdure
   verdi. Serve a farti capire dove sei senza leggere niente. */
.pasto-tabs{position:relative;display:flex;gap:4px;margin:2px 0 14px}
.pasto-tab{flex:1;background:none;border:none;color:var(--text-tertiary);font-size:.78rem;
  font-weight:700;letter-spacing:.3px;padding:8px 4px 12px;transition:color .25s}
.pasto-tab.active{color:var(--tema, var(--accent-primary))}
.pasto-barra{position:absolute;bottom:4px;left:0;width:33.333%;height:2px;border-radius:2px;
  background:var(--tema, var(--accent-primary));transition:transform .3s cubic-bezier(.4,0,.2,1),background .4s}

.pager{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
  margin:0 -16px;padding:0 0 4px;-webkit-overflow-scrolling:touch}
.pager::-webkit-scrollbar{display:none}
.pagina{flex:0 0 100%;scroll-snap-align:center;padding:0 16px;
  --tema:var(--accent-primary);--tema2:var(--accent-primary)}
#pagina-col{--tema:var(--pasto-col, #ff6115);--tema2:var(--pasto-col-2, #c2410c)}
#pagina-pra{--tema:var(--pasto-pra, #d84a00);--tema2:var(--pasto-pra-2, #9a3412)}
#pagina-cen{--tema:var(--pasto-cen, #a63a05);--tema2:var(--pasto-cen-2, #7c2d00)}

/* Il piatto sente il peso: scende subito, resta giu' un attimo, poi risale
   con un piccolo rimbalzo e si ferma. */
@keyframes molleggia{
  0%{transform:translateY(0)} 10%{transform:translateY(5px)}
  55%{transform:translateY(4.2px)} 74%{transform:translateY(-1.4px)}
  87%{transform:translateY(.6px)} 100%{transform:translateY(0)}}
.gruppo-ago.oscilla{animation:tentenna .95s linear both}
/* L'ago vibra svelto destra-sinistra per mezzo secondo scarso, poi lo
   smorzamento lo porta a fermarsi esattamente dove deve stare. */
@keyframes tentenna{
  0%{transform:rotate(0)} 7%{transform:rotate(8deg)} 15%{transform:rotate(-7deg)}
  23%{transform:rotate(6deg)} 31%{transform:rotate(-4.5deg)} 39%{transform:rotate(3.2deg)}
  49%{transform:rotate(-2deg)} 61%{transform:rotate(1.1deg)} 76%{transform:rotate(-.5deg)}
  100%{transform:rotate(0)}}

    case 'cuoci-fai': {
      const q = parseFloat(F('cuoci-qta').value);
      if (!isFinite(q) || q <= 0) { toast('Quanti ne hai cotti?'); break; }
      pushUndo('Passaggio da crudo a cotto');
      const r = passaACotto(val, q);
      cuociAperto = null;
      renderAll();
      if (r) toast(r.preso + ' di ' + r.nome + ': da adesso ' + r.giorni
        + (r.giorni === 1 ? ' giorno' : ' giorni') + '.', 'Annulla');
      break;
    }
    case 'fresco-posto': {
      const v = freschezza()[val];
      if (!v) break;
      // Gira sui tre posti: frigo, dispensa, freezer.
      const giro = ['frigo', 'dispensa', 'freezer'];
      const ora = giro.indexOf(v.posto || 'frigo');
      v.posto = giro[(ora + 1) % giro.length];
      if (v.posto === 'freezer') { v.dal = v.dal || Date.now(); v.entro = null; }
      else if (!v.entro) {
        const g = giorniFreschezza(v.nome);
        if (g) v.entro = v.dal + g * 86400000;
      }
      // la scelta esplicita insegna al catalogo, come dagli altri punti:
      // al prossimo acquisto il prodotto tornera' da solo in questo posto
      catalogoRegistra(v.nome, v.posto);
      save(); renderFridge();
      break;
    }
    case 'fresco-del':
      delete freschezza()[val];
      save(); renderFridge();
      break;
    case 'scongela': {
      // Dal freezer al frigo: riparte il conto delle ore, com'e' giusto.
      const x = (S.leftovers || []).find(y => y.rid === val && y.dove === 'freezer');
      if (!x) break;
      pushUndo('Porzioni spostate in frigo');
      x.dove = 'frigo';
      x.ts = Date.now();
      save(); renderAll();
      toast(x.title + ' passa in frigo: da qui vale la finestra del fresco.', 'Annulla');
      break;
    }

      const rIng = riconosciIngrediente(nome);

      toast(nome + ' nel freezer' + (gIng ? ' · ' + gIng.punteggio + '/100 ' + gIng.nome : '') + '.', 'Annulla');

        rispostaCena);
      break;
    }
    case 'group-url': {
      const v = (F('group-url').value || '').trim();
      if (!/^https?:\/\//.test(v)) { toast('Inserisci un indirizzo che inizia con https://'); break; }
      S.group.url = v.replace(/\/+$/, ''); save(); renderGroup(); toast('Endpoint salvato.');
      break;
    }
    case 'group-forget-url': S.group.url = ''; save(); renderGroup(); break;
    case 'group-create': {
      if (!cryptoReady()) { toast('Serve una connessione sicura (https) per creare un gruppo.'); break; }
      S.group.code = newGroupCode();
      S.profiles.forEach(touchProfile);
      save(); renderGroup();
      groupSync(false);
      break;
    }
    case 'group-join': {
      const v = (F('group-join').value || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (v.length !== 16) { toast('Il codice \u00e8 di 16 caratteri.'); break; }
      S.group.code = v.replace(/(.{4})(?=.)/g, '$1-');
      save(); renderGroup();
      groupSync(false);
      break;
    }
    case 'group-sync': groupSync(false); break;
    case 'group-copy':
      navigator.clipboard && navigator.clipboard.writeText(S.group.code)
        .then(() => toast('Codice copiato.'))
        .catch(() => toast('Copia non riuscita: selezionalo a mano.'));
      break;
    case 'group-leave':
      if (!armed(t, 'Conferma uscita')) break;
      S.group.code = ''; S.group.last = 0; save(); renderGroup();
      toast('Uscito dal gruppo. I profili restano su questo dispositivo.');
      break;
    case 'export-csv': {
      const righe = [['data', 'ora', 'profilo', 'pasto', 'piatto', 'kcal', 'proteine_g', 'porzione', 'avanzo']];
      const nomePasto = id => (S.meals.find(m => m.id === id) || {}).name || '';
      S.log.slice().sort((a, b) => a.ts - b.ts).forEach(x => {
        const d = new Date(x.ts);
        const prof = S.profiles.find(p => p.id === x.pid);
        righe.push([
          d.toLocaleDateString('it-IT'), d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }),
          (prof && prof.name) || '', nomePasto(x.meal), x.title,
          x.kcal, x.pro, x.mult || 1, x.avanzo ? 'si' : 'no'
        ]);
      });
      // Punto e virgola: è il separatore che Excel italiano si aspetta.
      const csv = '\ufeff' + righe.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(';')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'fitmeals-diario-' + new Date().toISOString().slice(0, 10) + '.csv';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      toast(S.log.length + ' pasti esportati.');
      break;
    }
    case 'export': exportBackup(); break;
    case 'import': F('import-file').click(); break;
    case 'reset':
      if (!armed(t, 'Conferma ripristino')) break;
      pushUndo('Ripristino dei dati di esempio');
      S = clone(SEED); S.ui.protein = GRILL[0].id; S.ui.active = S.profiles[0].id; S.ui.cookFor = [S.profiles[0].id]; save(); renderAll(); toast('Dati ripristinati.', 'Annulla');
      break;
    case 'install': doInstall(); break;
  }
  } catch (err) {
    console.error('Azione "' + act + '" fallita:', err);
    toast('Non sono riuscito a completare l\'operazione.');
  }
});

/* La finestra della ricetta si chiude anche trascinandola in basso, come
   un foglio: la segui col dito, e oltre la soglia se ne va. */
(function () {
  const modale = document.getElementById('modal-detail');
  if (!modale) return;
  const foglio = modale.querySelector('.modal-content');
  if (!foglio) return;
  let y0 = null, dy = 0;

  foglio.addEventListener('touchstart', e => {
    if (foglio.scrollTop > 8) { y0 = null; return; }
    y0 = e.touches[0].clientY; dy = 0;
    foglio.style.transition = 'none';
  }, { passive: true });

  foglio.addEventListener('touchmove', e => {
    if (y0 === null) return;
    dy = Math.max(0, e.touches[0].clientY - y0);
    if (dy > 0) foglio.style.transform = 'translateY(' + dy + 'px)';
  }, { passive: true });

  foglio.addEventListener('touchend', () => {
    if (y0 === null) return;
    foglio.style.transition = '';
    if (dy > 90) {
      foglio.style.transform = 'translateY(100vh)';
      setTimeout(() => {
        foglio.style.transform = '';
        istanzaAperta = null;
        const x = modale.querySelector('[data-act=close-modal]');
        if (x) x.click();
      }, 180);
    } else {
      foglio.style.transform = '';
    }
    y0 = null; dy = 0;
  });
})();

/* Avviso sugli avanzi che stanno per scadere: una volta al giorno, non a ogni
   apertura, altrimenti diventa rumore e si smette di leggerlo. */
(function () {
  const freschi = freschiInScadenza();
  if (freschi.length && S.ui.avvisoFreschi !== dayKey()) {
    S.ui.avvisoFreschi = dayKey();
    save();
    const f = freschi[0];
    const st = statoFresco(f);
    setTimeout(() => {
      toast(freschi.length === 1
        ? f.nome + ': ' + st.testo + '.'
        : freschi.length + ' cose in frigo da usare entro domani.', 'Vedi',
        { act: 'tab', val: 'view-fridge' });
    }, 700);
  }
})();

(function () {

    S.ui.avvisoFreezer = dayKey();
    save();
    const x = gelo[0];
    setTimeout(() => {
      toast(gelo.length === 1

})();

  S.ui.avvisoAvanzi = dayKey();

      ? x.title + ': ' + st.testo + '.'
      : scadenza.length + ' avanzi da finire entro oggi.', 'Vedi',
      { act: 'tab', val: 'view-fridge' });

})();

// All'apertura si parte dal pasto che ha senso a quest'ora.

})();

// Se l'app è stata aperta da un link di condivisione, propongo l'unione.
// E se l'app era GIA' aperta quando il link arriva — succede con l'app
// installata e con le schede riusate: il browser cambia solo il frammento,
// SENZA ricaricare la pagina — il pacco si legge lo stesso: prima questo
// mancava, e il link sembrava non fare niente.
function gestisciHashPacco() {
  const m = (location.hash || '').match(/#fm=([A-Za-z0-9\-_]+)/);
  if (!m) return;
  history.replaceState(null, '', location.pathname);   // il link non resta nella barra
  leggiPacco(m[1]).then(d => {
    // i pacchi nuovi (invito in famiglia, spesa, cena) sanno cosa fare da soli
    if (riceviPacco(d, m[1])) return;
    const chi = d.da || 'un altro telefono';
    toast('Dati ricevuti da ' + chi + '. Vuoi unirli ai tuoi?', 'Unisci',
          { act: 'link-merge', val: m[1] });
  }).catch(e => toast(e && e.codice === 'niente-decompressione'
    ? 'Questo browser non riesce ad aprire il link (serve internet la prima volta): riprova con Chrome o Safari aggiornati.'
    : 'Il link ricevuto non \u00e8 leggibile: forse si \u00e8 spezzato nell\'invio.'));
}
gestisciHashPacco();
window.addEventListener('hashchange', gestisciHashPacco);

// Timer: riprendo quelli in corso e ricalcolo dall'orario di fine, non dal
// tempo trascorso, cosi la pausa del telefono non li falsa.

/* Il guardiano della mezzanotte: quando cambia il giorno la bilancia si
   riazzera davanti ai tuoi occhi. Niente va perso: ogni pasto resta nel
   registro con la sua ora, semplicemente da oggi il conto riparte. */
let giornoCorrente = dayKey(Date.now());
setInterval(() => {
  const adesso = dayKey(Date.now());
  if (adesso === giornoCorrente) return;
  giornoCorrente = adesso;
  renderAll();
  // l'ago torna a zero tentennando, e il braccio molleggia: si vede che riparte
  document.querySelectorAll('.gruppo-ago, .gruppo-piatto').forEach(el => {
    el.classList.remove('oscilla');
    void el.getBoundingClientRect();
    el.classList.add('oscilla');
  });
  toast('\u2600\ufe0f Nuovo giorno: la bilancia riparte da zero. Ieri \u00e8 al sicuro nello storico.');
}, 30000);

document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  loadTimers();
  renderTimers();
  if (TIMERS.length) { ensureTick(); keepScreenAwake(true); }
});

// All'apertura provo ad allineare il gruppo, senza disturbare se non c'e rete.
if (S.group && S.group.url && S.group.code) setTimeout(() => groupSync(true), 800);

 suggestions:mealId=>{const row=dayPlan().meals.find(x=>x.m.id===mealId);return suggestFor(mealId,row?.budget??null,row?.budgetP??null).map(o=>({...window.MealUpVisualData.recipe(o.r.id),kcal:o.kcal}));},
 current:()=>({detail:currentDetailId?window.MealUpVisualData.recipe(currentDetailId):null,cook:COOK?window.MealUpVisualData.recipe(COOK.id):null})
});
